<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>加入微信群</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f7; color: #222; }
    main { width: min(92vw, 430px); box-sizing: border-box; padding: 28px 22px 32px; text-align: center; background: #fff; border-radius: 18px; box-shadow: 0 8px 30px #00000012; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 8px 0; color: #666; line-height: 1.6; }
    .qr { display: block; width: min(82vw, 360px); margin: 22px auto 16px; border-radius: 8px; }
    .tip { font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <main>
    <h1>扫码加入微信群</h1>
    <p>请使用微信扫一扫识别下方二维码</p>
    <img class="qr" src="group-qr.jpg" alt="微信群二维码">
    <p class="tip">二维码失效后，只需替换本页面的 group-qr.jpg，外层活码无需更换。</p>
  </main>
</body>
</html>
